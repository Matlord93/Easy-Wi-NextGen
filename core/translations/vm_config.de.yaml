vm_config.cloud_title: 'Cloud-Init-Vorgaben'
vm_config.cloud_hint: 'Nur bei ausgeschalteter VM. Diese Vorgaben gelten für die Initialisierung. Bereits eingerichtete Gäste übernehmen sie meist nicht erneut; es erfolgt keine automatische Neuinitialisierung und keine bestätigte Änderung im laufenden Gast.'
vm_config.hostname: 'Hostname'
vm_config.username: 'Cloud-Init-Benutzer'
vm_config.keys: 'Öffentliche SSH-Schlüssel'
vm_config.keys_hint: 'Ein öffentlicher Schlüssel je Zeile, maximal acht. Keine privaten Schlüssel oder Schlüsseloptionen. Die bisherigen Cloud-Init-Schlüssel dieses Benutzers werden ersetzt.'
vm_config.save: 'Vorgaben speichern'
vm_config.pve_name_hint: 'Der Hostname wird zugleich als VM-Name in Proxmox gespeichert. Benutzer und Schlüssel sind Vorgaben für die Initialisierung.'
vm_config.no_cloud_init: 'Ein vorhandenes Cloud-Init-Laufwerk ohne benutzerdefinierte Cloud-Init-Dateien wird benötigt. Hier wird kein Laufwerk automatisch hinzugefügt.'
vm_config.boot: 'Boot-Reihenfolge'
vm_config.boot_devices: 'Geräte in Startreihenfolge'
vm_config.boot_hint: 'Vorhandene Gerätenamen mit Semikolon trennen, z. B. scsi0;net0. Änderung nur bei ausgeschalteter VM.'
vm_config.agent: 'QEMU Guest Agent'
vm_config.agent_hint: 'Bereitet die Anbindung auf dem Host vor. Der Guest Agent muss zusätzlich im Gast installiert und gestartet sein. Hier wird seine Erreichbarkeit nicht bestätigt. Änderung nur bei ausgeschalteter VM.'
vm_config.agent_enable: 'Guest-Agent-Anbindung vorbereiten'
vm_config.update_inventory: 'Agent aktualisieren und das Inventar neu einlesen. Cloud-Init benötigt außerdem die ursprünglichen verwalteten Initialisierungsdateien.'
vm_config.network_boot_hint: 'Nur bei ausgeschalteter VM. Netzwerkstart setzt eine externe PXE-Konfiguration voraus und fällt anschließend auf die Festplatte zurück.'
vm_config.disk_first: 'Festplatte'
vm_config.network_first: 'Netzwerk (PXE), danach Festplatte'
vm_config.invalid_hostname: 'Ein gültiger Hostname mit maximal 48 kleinen Buchstaben, Ziffern und Bindestrichen wird benötigt; kein Bindestrich am Anfang oder Ende.'
vm_config.invalid_keys: 'Bitte ein bis acht gültige öffentliche SSH-Schlüssel ohne Schlüsseloptionen eingeben (maximal 32 KiB).'
vm_config.invalid_user: 'Ein gültiger Linux-Benutzername mit maximal 31 Zeichen wird benötigt.'
vm_config.invalid_boot: 'Bitte ausschließlich vorhandene, eindeutige Boot-Geräte in gültiger Reihenfolge auswählen.'
