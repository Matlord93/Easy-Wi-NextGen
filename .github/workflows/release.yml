name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect release channel
        id: channel
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          shopt -s nocasematch
          if [[ "$tag" == *-predev* || "$tag" == *-dev* || "$tag" == *-alpha* || "$tag" == *-snapshot* || "$tag" == *-nightly* ]]; then
            channel="dev"
            prerelease="true"
          elif [[ "$tag" == *-beta* || "$tag" == *-preview* || "$tag" == *-rc* ]]; then
            channel="beta"
            prerelease="true"
          else
            channel="stable"
            prerelease="false"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Setup Go for agent builds
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          AGENT_LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=${BUILD_DATE}"

          bash scripts/prepare-minecraft-catalog.sh core

          tar \
            --exclude='core/.env.local' \
            --exclude='core/.env.local.php' \
            --exclude='var' \
            --exclude='storage' \
            --exclude='uploads' \
            --exclude='srv' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git' \
            -czf dist/release/easywi-core.tar.gz core
          (cd . && zip -qr "dist/release/easywi-webinterface-${VERSION}.zip" core \
            -x 'core/.env.local' 'core/.env.local.php' 'core/var/*' 'core/storage/*' 'core/uploads/*' 'core/srv/*' 'core/node_modules/*' 'core/vendor/*')

          python - <<'PYTAR'
          import tarfile
          import sys

          with tarfile.open('dist/release/easywi-core.tar.gz', 'r:gz') as archive:
              if 'core/.env' not in archive.getnames():
                  print('core/.env missing from easywi-core.tar.gz', file=sys.stderr)
                  sys.exit(1)
              for path in ('core/tools/console/configure-live-console.py', 'core/tools/console/live-console.conf.template', 'core/public/js/gameserver/console-live.js'):
                  if path not in archive.getnames():
                      raise SystemExit(path + ' missing from core archive')
              for name in ('minecraft-server.json', 'paper-versions.json', 'bedrock-server.json'):
                  if 'core/resources/minecraft/' + name not in archive.getnames():
                      raise SystemExit(name + ' missing from core archive')
          PYTAR
          unzip -l "dist/release/easywi-webinterface-${VERSION}.zip" core/.env >/dev/null \
            || { echo 'core/.env missing from easywi-webinterface zip' >&2; exit 1; }
          for f in core/resources/minecraft/bedrock-server.json core/resources/minecraft/minecraft-server.json core/resources/minecraft/paper-versions.json core/tools/console/configure-live-console.py core/tools/console/live-console.conf.template core/public/js/gameserver/console-live.js; do
            unzip -l "dist/release/easywi-webinterface-${VERSION}.zip" "$f" >/dev/null \
              || { echo "$f missing from easywi-webinterface zip" >&2; exit 1; }
          done

          for target in linux-amd64 linux-arm64 windows-amd64; do
            goos="${target%-*}"
            goarch="${target##*-}"
            stage_dir="dist/agent-${target}"
            mkdir -p "$stage_dir"
            bins=(easywi-agent easywi-musicbot)
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            else
              for optional in easywi-teamspeak-bridge easywi-teamspeak-client; do
                [[ ! -d "agent/cmd/$optional" ]] || bins+=("$optional")
              done
            fi
            for binary in "${bins[@]}"; do
              package="$binary"
              [[ "$binary" != "easywi-agent" ]] || package="agent"
              (cd agent && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags "$AGENT_LDFLAGS" \
                -o "../${stage_dir}/${binary}${suffix}" "./cmd/${package}")
            done
            (cd "$stage_dir" && zip -q "../release/easywi-agent-${target}.zip" "${bins[@]/%/$suffix}")
            (cd "$stage_dir" && zip -q "../release/easywi-musicbot-${target}.zip" "easywi-musicbot${suffix}")
            if [[ "$goos" == "linux" ]]; then
              (cd "$stage_dir" && tar -czf "../release/easywi-agent-${target}.tar.gz" "${bins[@]}")
              (cd "$stage_dir" && tar -czf "../release/easywi-musicbot-${target}.tar.gz" easywi-musicbot)
              if [[ -f "$stage_dir/easywi-teamspeak-bridge" ]]; then
                mv "$stage_dir/easywi-teamspeak-bridge" "$stage_dir/easywi-teamspeak-bridge-${target}"
                (cd "$stage_dir" && zip -q "../release/easywi-teamspeak-bridge-${target}.zip" "easywi-teamspeak-bridge-${target}")
              fi
            fi
          done

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist/release && sha256sum easywi-core.tar.gz > checksums-core.txt)
          (cd dist/release && sha256sum easywi-webinterface-*.zip > checksums-webinterface.txt)
          (
            cd dist/release
            shopt -s nullglob
            for platform in linux windows; do
              assets=(easywi-agent-"${platform}"-* easywi-musicbot-"${platform}"-* easywi-teamspeak-bridge-"${platform}"-*)
              sha256sum "${assets[@]}" > "checksums-agent-${platform}.txt"
            done
            cat checksums-agent-linux.txt checksums-agent-windows.txt > checksums-agent.txt
            sha256sum --check checksums-agent.txt
          )

      - name: Sign core checksums (optional)
        env:
          EASYWI_RELEASE_PRIVATE_KEY: ${{ secrets.EASYWI_RELEASE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYWI_RELEASE_PRIVATE_KEY}" ]]; then
            echo "EASYWI_RELEASE_PRIVATE_KEY is not configured; skipping core checksum signing" >&2
            exit 0
          fi
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$EASYWI_RELEASE_PRIVATE_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out dist/release/checksums-core.txt.asc dist/release/checksums-core.txt
          openssl dgst -sha256 -sign "$key_file" -out dist/release/checksums-webinterface.txt.asc dist/release/checksums-webinterface.txt

      - name: Sign agent checksums (optional)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EASYWI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EASYWI_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "EASYWI_GPG_PRIVATE_KEY is not configured; skipping agent checksum signing" >&2
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in dist/release/checksums-agent*.txt; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ steps.channel.outputs.prerelease }}
          fail_on_unmatched_files: false
          body: |
            channel: ${{ steps.channel.outputs.channel }}
            commit: ${{ github.sha }}

            Assets:
            - easywi-core.tar.gz
            - easywi-webinterface-<version>.zip (version without leading v)
            - checksums-core.txt
            - checksums-webinterface.txt
            - Agent and Musicbot archives for Linux amd64, Linux arm64 and Windows amd64
            - TeamSpeak bridge packages for Linux
            - checksums-agent.txt and platform checksum files
          files: |
            dist/release/easywi-core.tar.gz
            dist/release/easywi-webinterface-*.zip
            dist/release/checksums-core.txt
            dist/release/checksums-core.txt.asc
            dist/release/checksums-webinterface.txt
            dist/release/checksums-webinterface.txt.asc
            dist/release/easywi-agent-*.tar.gz
            dist/release/easywi-agent-*.zip
            dist/release/easywi-musicbot-*.tar.gz
            dist/release/easywi-musicbot-*.zip
            dist/release/easywi-teamspeak-bridge-*.zip
            dist/release/checksums-agent*.txt
            dist/release/checksums-agent*.txt.asc
