name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_call:
    inputs:
      repair_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.history.outputs.tag }}
      version: ${{ steps.history.outputs.version }}
      commit: ${{ steps.history.outputs.head_sha }}
      base_tag: ${{ steps.history.outputs.base_tag }}
      base_sha: ${{ steps.history.outputs.base_sha }}
      channel: ${{ steps.history.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version and prepare the manual changelog
        id: history
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
        run: |
          set -euo pipefail
          head=HEAD
          if [[ -n "$REPAIR_TAG" ]]; then
            tag="$REPAIR_TAG"
            head="refs/tags/$tag"
            git show-ref --verify --quiet "$head"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(cat VERSION)"
          fi
          python3 scripts/ci-changelog.py --tag "$tag" --head "$head" --check-releases --github-output "$GITHUB_OUTPUT" \
            --output dist/notes/CHANGELOG.md --release-body dist/notes/release-notes.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          overwrite: true
          path: dist/notes/*.md
          if-no-files-found: error

  core:
    needs: changelog
    uses: ./.github/workflows/ci-core.yml
    with:
      release_package: true
      version: ${{ needs.changelog.outputs.version }}
      ref: ${{ needs.changelog.outputs.commit }}
    secrets: inherit

  installer:
    needs: changelog
    uses: ./.github/workflows/ci-installer.yml
    with:
      release_package: true
      ref: ${{ needs.changelog.outputs.commit }}

  build:
    needs: [changelog, core, installer]
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.publication.outputs.mode }}
    env:
      RELEASE_TAG: ${{ needs.changelog.outputs.tag }}
      RELEASE_VERSION: ${{ needs.changelog.outputs.version }}
      RELEASE_COMMIT: ${{ needs.changelog.outputs.commit }}
    steps:
      - name: Check release publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_TAG: ${{ inputs.repair_tag }}
        shell: bash
        run: |
          set -euo pipefail
          error_log="$(mktemp)"
          trap 'rm -f "$error_log"' EXIT
          mode=new
          if details="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>"$error_log")"; then
            mode="$(jq -er '
              if (.isDraft | type) != "boolean" or (.assets | type) != "array" then error("Invalid release state")
              elif .isDraft then "draft" elif (.assets | length) == 0 then "empty" else "with-assets" end
            ' <<< "$details")"
          elif ! grep -Fqi 'release not found' "$error_log"; then
            cat "$error_log" >&2
            exit 1
          fi
          if [[ -n "$REPAIR_TAG" && "$mode" != empty ]]; then
            echo "A manual repair requires a published release without uploaded assets. Found: $mode." >&2
            exit 1
          fi
          echo "Release $RELEASE_TAG: $mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [[ "$mode" != with-assets ]]; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.publication.outputs.pending == 'true'
        with:
          ref: ${{ needs.changelog.outputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        if: steps.publication.outputs.pending == 'true'
        with:
          pattern: release-[cin]*
          path: dist/downloads

      - name: Prepare panel and installer assets
        if: steps.publication.outputs.pending == 'true'
        env:
          BASE_TAG: ${{ needs.changelog.outputs.base_tag }}
          BASE_SHA: ${{ needs.changelog.outputs.base_sha }}
        run: |
          mkdir -p dist/release
          cp "dist/downloads/release-core/easywi-core-${RELEASE_VERSION}.tar.gz" dist/release/
          cp dist/downloads/release-installer/easywi-installer-* dist/release/
          cp dist/downloads/release-notes/CHANGELOG.md dist/release/
          bash scripts/build-panel-release.sh "$RELEASE_TAG" "$BASE_TAG" "$BASE_SHA" \
            dist/release dist/downloads/release-notes/release-notes.md

      - name: Setup Go for agent builds
        if: steps.publication.outputs.pending == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Build release assets
        if: steps.publication.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          VERSION="$RELEASE_VERSION"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          AGENT_LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${RELEASE_COMMIT} -X main.date=${BUILD_DATE}"

          tar \
            --exclude='core/.env.local' \
            --exclude='core/.env.local.php' \
            --exclude='var' \
            --exclude='storage' \
            --exclude='uploads' \
            --exclude='srv' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.git' \
            -czf dist/release/easywi-core.tar.gz core
          python3 - <<'PYTAR'
          import tarfile
          import sys

          with tarfile.open('dist/release/easywi-core.tar.gz', 'r:gz') as archive:
              if 'core/.env' not in archive.getnames():
                  print('core/.env missing from easywi-core.tar.gz', file=sys.stderr)
                  sys.exit(1)
              for path in ('core/tools/console/configure-live-console.py', 'core/tools/console/live-console.conf.template', 'core/public/js/gameserver/console-live.js'):
                  if path not in archive.getnames():
                      raise SystemExit(path + ' missing from core archive')
              for name in ('minecraft-server.json', 'paper-versions.json', 'bedrock-server.json'):
                  if 'core/resources/minecraft/' + name not in archive.getnames():
                      raise SystemExit(name + ' missing from core archive')
          PYTAR
          for target in linux-amd64 linux-arm64 windows-amd64; do
            goos="${target%-*}"
            goarch="${target##*-}"
            stage_dir="dist/agent-${target}"
            mkdir -p "$stage_dir"
            bins=(easywi-agent easywi-musicbot)
            suffix=""
            if [[ "$goos" == "windows" ]]; then
              suffix=".exe"
            else
              for optional in easywi-teamspeak-bridge easywi-teamspeak-client; do
                [[ ! -d "agent/cmd/$optional" ]] || bins+=("$optional")
              done
            fi
            for binary in "${bins[@]}"; do
              package="$binary"
              [[ "$binary" != "easywi-agent" ]] || package="agent"
              (cd agent && GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -trimpath -ldflags "$AGENT_LDFLAGS" \
                -o "../${stage_dir}/${binary}${suffix}" "./cmd/${package}")
            done
            (cd "$stage_dir" && zip -q "../release/easywi-agent-${target}.zip" "${bins[@]/%/$suffix}")
            (cd "$stage_dir" && zip -q "../release/easywi-musicbot-${target}.zip" "easywi-musicbot${suffix}")
            if [[ "$goos" == "linux" ]]; then
              (cd "$stage_dir" && tar -czf "../release/easywi-agent-${target}.tar.gz" "${bins[@]}")
              (cd "$stage_dir" && tar -czf "../release/easywi-musicbot-${target}.tar.gz" easywi-musicbot)
              if [[ -f "$stage_dir/easywi-teamspeak-bridge" ]]; then
                mv "$stage_dir/easywi-teamspeak-bridge" "$stage_dir/easywi-teamspeak-bridge-${target}"
                (cd "$stage_dir" && zip -q "../release/easywi-teamspeak-bridge-${target}.zip" "easywi-teamspeak-bridge-${target}")
              fi
            fi
          done

      - name: Generate checksums
        if: steps.publication.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist/release
            sha256sum easywi-webinterface-*.zip > checksums-webinterface.txt
            sha256sum easywi-core*.tar.gz easywi-webinterface-*.zip > checksums-core.txt
            sha256sum easywi-installer-* > checksums-installer.txt
            sha256sum --check checksums-core.txt
            sha256sum --check checksums-webinterface.txt
            sha256sum --check checksums-installer.txt
          )
          (
            cd dist/release
            shopt -s nullglob
            for platform in linux windows; do
              assets=(easywi-agent-"${platform}"-* easywi-musicbot-"${platform}"-* easywi-teamspeak-bridge-"${platform}"-*)
              sha256sum "${assets[@]}" > "checksums-agent-${platform}.txt"
            done
            cat checksums-agent-linux.txt checksums-agent-windows.txt > checksums-agent.txt
            sha256sum --check checksums-agent.txt
          )

      - name: Sign core checksums (optional)
        if: steps.publication.outputs.pending == 'true'
        env:
          EASYWI_RELEASE_PRIVATE_KEY: ${{ secrets.EASYWI_RELEASE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EASYWI_RELEASE_PRIVATE_KEY}" ]]; then
            echo "EASYWI_RELEASE_PRIVATE_KEY is not configured; skipping core checksum signing" >&2
            exit 0
          fi
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$EASYWI_RELEASE_PRIVATE_KEY" > "$key_file"
          openssl dgst -sha256 -sign "$key_file" -out dist/release/checksums-core.txt.asc dist/release/checksums-core.txt
          openssl dgst -sha256 -sign "$key_file" -out dist/release/checksums-webinterface.txt.asc dist/release/checksums-webinterface.txt

      - name: Sign released updates and checksums with GPG (optional)
        if: steps.publication.outputs.pending == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.EASYWI_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.EASYWI_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GPG_PRIVATE_KEY}" ]]; then
            echo "EASYWI_GPG_PRIVATE_KEY is not configured; skipping GPG signing" >&2
            exit 0
          fi
          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          for file in dist/release/checksums-agent*.txt dist/release/checksums-installer.txt \
            dist/release/checksums-core.txt dist/release/checksums-webinterface.txt dist/release/manifest*.json; do
            [[ ! -f "$file.asc" ]] || continue
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --armor --detach-sign "$file"
          done

      - uses: actions/upload-artifact@v7
        if: steps.publication.outputs.pending == 'true'
        with:
          name: release-ready
          path: dist/release/*
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [changelog, build]
    if: needs.build.outputs.mode != 'with-assets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: easywi-release-${{ needs.changelog.outputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ needs.changelog.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release-ready
          path: dist/release

      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist/notes

      - name: Recheck the release before upload
        id: publication
        env:
          REPAIR_TAG: ${{ inputs.repair_tag }}
        run: |
          mode="$(python3 scripts/complete-published-release.py state "$RELEASE_TAG")"
          if [[ -n "$REPAIR_TAG" && ( "$mode" == new || "$mode" == draft ) ]]; then
            echo 'The release is no longer published.' >&2
            exit 1
          fi
          if [[ "$mode" == with-assets ]]; then
            mode=empty
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Attach packages to an already published release
        if: steps.publication.outputs.mode == 'empty'
        run: python3 scripts/complete-published-release.py upload "$RELEASE_TAG" dist/release dist/notes/release-notes.md

      - name: Upload complete release as draft
        if: steps.publication.outputs.mode == 'new' || steps.publication.outputs.mode == 'draft'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.changelog.outputs.tag }}
          target_commitish: ${{ needs.changelog.outputs.commit }}
          prerelease: ${{ needs.changelog.outputs.channel != 'stable' }}
          draft: true
          fail_on_unmatched_files: true
          body_path: dist/notes/release-notes.md
          files: dist/release/*

      - name: Publish after all assets were uploaded
        if: steps.publication.outputs.mode == 'new' || steps.publication.outputs.mode == 'draft'
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
