name: security-codeql

on:
  push:
    branches: [ main, Dev, Beta ]
    paths:
      - 'core/**'
      - 'agent/**'
      - 'installer/**'
      - 'docs/**'
      - 'README*'
      - 'VERSION'
      - 'templates_audit.md'
      - '.github/workflows/security-codeql.yml'
      - '.github/actions/configure-go-build-cache/**'
      - '.github/actions/verify-php/**'
      - 'scripts/normalize-psalm-sarif.php'
      - 'scripts/tests/test_normalize_psalm_sarif.py'
  pull_request:
    paths:
      - 'core/**'
      - 'agent/**'
      - 'installer/**'
      - 'docs/**'
      - 'README*'
      - 'VERSION'
      - 'templates_audit.md'
      - '.github/workflows/security-codeql.yml'
      - '.github/actions/configure-go-build-cache/**'
      - '.github/actions/verify-php/**'
      - 'scripts/normalize-psalm-sarif.php'
      - 'scripts/tests/test_normalize_psalm_sarif.py'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: security-codeql
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Ensure non-root runner user
        uses: ./.github/actions/ensure-runner-user

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: 'false'

      - name: Configure isolated Go build cache
        uses: ./.github/actions/configure-go-build-cache

      - name: Initialize CodeQL (Go)
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: go
          queries: +security-extended
          config-file: .github/codeql/codeql-config.yml

      - name: Build Go for CodeQL
        run: go build ./...
        working-directory: agent

      - name: Analyze (Go)
        uses: github/codeql-action/analyze@v4.39.3

      - name: Verify PHP 8.5 environment
        uses: ./.github/actions/verify-php
        with:
          required-extensions: curl, dom, fileinfo, gd, intl, mbstring, pdo_mysql, pdo_sqlite, redis, simplexml, xml, zip

      - name: Install PHP application and locked Psalm tools
        run: |
          set -euo pipefail
          composer install --working-dir=core --no-scripts --no-interaction --no-progress --prefer-dist
          composer install --working-dir=core/tools/psalm --no-scripts --no-interaction --no-progress --prefer-dist
          APP_ENV=dev APP_DEBUG=1 php core/bin/console cache:warmup

      - name: Verify SARIF normalization preserves findings
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest scripts/tests/test_normalize_psalm_sarif.py -v

      - name: Run Psalm security scan (PHP)
        id: psalm
        working-directory: core
        run: |
          set -euo pipefail
          rm -f ../results.sarif
          set +e
          php -d memory_limit=-1 tools/psalm/vendor/bin/psalm --config=psalm.xml --output-format=github --taint-analysis --report=../results.sarif
          psalm_exit_code=$?
          set -e
          echo "exit_code=$psalm_exit_code" >> "$GITHUB_OUTPUT"

      - name: Normalize Psalm SARIF metadata
        if: always() && hashFiles('results.sarif') != ''
        run: php scripts/normalize-psalm-sarif.php results.sarif

      - name: Upload Psalm SARIF to GitHub Code Scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4.39.3
        with:
          sarif_file: results.sarif
          category: psalm-php

      - name: Enforce Psalm analysis result
        if: always()
        env:
          PSALM_EXIT_CODE: ${{ steps.psalm.outputs.exit_code }}
        run: |
          if [ -z "$PSALM_EXIT_CODE" ]; then
            echo 'Psalm did not complete; no analysis exit code was produced.' >&2
            exit 1
          fi
          exit "$PSALM_EXIT_CODE"
