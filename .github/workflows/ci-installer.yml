name: Installer CI

on:
  push:
    branches: [ main, Dev, Beta ]
  pull_request:
  workflow_call:
    inputs:
      release_package:
        type: boolean
        default: false
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Installer - lint
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}


      - name: Ensure non-root runner user
        uses: ./.github/actions/ensure-runner-user
      - name: ShellCheck (bash installer)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer

  release:
    name: Installer - package release assets
    needs: lint
    if: inputs.release_package
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}


      - name: Ensure non-root runner user
        uses: ./.github/actions/ensure-runner-user
      - name: Prepare dist
        run: |
          mkdir -p dist
          cp installer/easywi-installer-menu-linux.sh dist/
          cp installer/easywi-installer-menu-windows.ps1 dist/

      - uses: actions/upload-artifact@v7
        with:
          name: release-installer
          overwrite: true
          path: dist/easywi-installer-*
          if-no-files-found: error
