name: Agent Mail Skeleton CI

on:
  pull_request:
    paths:
      - 'scripts/ci-dependency-bootstrap.sh'
      - 'scripts/tests/test_ci_dependency_bootstrap.py'
      - 'agent/**'
      - '.github/workflows/agent-mail-skeleton-ci.yml'
      - '.github/actions/configure-go-build-cache/**'
  push:
    branches: [ main, Dev, Beta ]
    paths:
      - 'scripts/ci-dependency-bootstrap.sh'
      - 'scripts/tests/test_ci_dependency_bootstrap.py'
      - 'agent/**'
      - '.github/workflows/agent-mail-skeleton-ci.yml'
      - '.github/actions/configure-go-build-cache/**'

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7


      - name: Ensure non-root runner user
        uses: ./.github/actions/ensure-runner-user
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache: 'false'

      - name: Configure isolated Go build cache
        uses: ./.github/actions/configure-go-build-cache

      - name: Cache Go module downloads
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-gomod-${{ hashFiles('agent/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-gomod-

      - name: Verify dependency download retries
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s ../scripts/tests -p 'test_ci_dependency_bootstrap.py' -v

      - name: Download and verify Go modules
        run: bash ../scripts/ci-dependency-bootstrap.sh go
        env:
          EASYWI_GOPROXY_MIRROR: ${{ vars.EASYWI_GOPROXY_MIRROR || 'https://proxy.golang.org,direct' }}

      - name: Format check
        run: |
          files=$(gofmt -l ./cmd ./internal)
          if [ -n "$files" ]; then
            echo "Go files not formatted:" >&2
            echo "$files" >&2
            exit 1
          fi

      - name: Lint
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o bin/easywi-agent ./cmd/agent
